<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto & Stock Anomaly Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .navbar { background-color: #0d6efd !important; }
        .alert-item { border-left: 4px solid #ffc107; background: #2c2c2c; margin-bottom: 10px; padding: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Market Anomaly System</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Sidebar / Assets -->
            <div class="col-md-3">
                <div class="card p-3 mb-4">
                    <h5>Tracked Assets</h5>
                    <select id="assetSelect" class="form-select bg-dark text-white border-secondary mb-3" onchange="updateChart()">
                        {% for asset in assets %}
                        <option value="{{ asset.asset_id }}">{{ asset.name }} ({{ asset.symbol }})</option>
                        {% endfor %}
                    </select>
                    <div id="assetInfo">
                        <small class="text-muted">Select an asset to view real-time price history and anomaly trends.</small>
                    </div>
                </div>

                <div class="card p-3">
                    <h5>Recent Alerts</h5>
                    <div id="alertsList">
                        {% for alert in alerts %}
                        <div class="alert-item">
                            <small class="text-warning">Alert #{{ alert.alert_id }}</small><br>
                            {{ alert.alert_message }}
                        </div>
                        {% else %}
                        <p class="text-muted">No active anomalies detected.</p>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <!-- Main Chart Area -->
            <div class="col-md-9">
                <div class="card p-4">
                    <h5 id="chartTitle">Price History</h5>
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        async function updateChart() {
            const assetId = document.getElementById('assetSelect').value;
            const response = await fetch(`/api/prices/${assetId}`);
            const data = await response.json();

            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Price (USD)',
                        data: data.values,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { grid: { color: '#333' }, ticks: { color: '#aaa' } },
                        y: { grid: { color: '#333' }, ticks: { color: '#aaa' } }
                    },
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });
        }

        // Initial Load
        window.onload = updateChart;
    </script>
</body>
</html>
