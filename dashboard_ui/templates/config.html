<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config | Anomaly.AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0D1117; color: #F0F6FC; font-size: 14pt; }
        .high-contrast-card { background-color: #161B22; border: 1px solid #30363D; border-radius: 12px; }
        input[type=range] { width: 100%; height: 8px; background: #30363D; border-radius: 5px; appearance: none; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: #58A6FF; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-[#161B22] border-b border-[#30363D] px-8 py-4 mb-8">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center gap-4">
                <i class="fas fa-brain text-4xl text-[#58A6FF]"></i>
                <span class="text-2xl font-bold uppercase tracking-tight">ANOMALY.AI</span>
            </div>
            <div class="flex gap-8 text-lg font-semibold">
                <a href="/" class="hover:text-[#58A6FF]">Nerve Center</a>
                <a href="/stream" class="hover:text-[#58A6FF]">Live Stream</a>
                <a href="/config" class="nav-link-active border-b-2 border-[#58A6FF] text-[#58A6FF] pb-1">Config</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-8">
        <div class="mb-12">
            <h1 class="text-4xl font-black mb-4 uppercase">System Config</h1>
            <p class="text-[#8B949E]">Adjust the sensitivity of the AI models and deployment targets.</p>
        </div>

        <div class="space-y-8">
            <!-- Detection Thresholds -->
            <div class="high-contrast-card p-10">
                <h2 class="text-2xl font-bold mb-8 flex items-center gap-4">
                    <i class="fas fa-sliders-h text-[#58A6FF]"></i> Model Sensitivity
                </h2>
                <div class="space-y-10">
                    <div>
                        <div class="flex justify-between mb-4">
                            <label class="text-xl font-bold">Z-Score Threshold (Standard Deviations)</label>
                            <span class="text-[#58A6FF] font-mono text-xl">3.5σ</span>
                        </div>
                        <input type="range" min="1" max="10" step="0.1" value="3.5">
                        <p class="text-sm text-[#8B949E] mt-4">Higher values reduce false positives but might miss subtle manipulation.</p>
                    </div>
                    <div>
                        <div class="flex justify-between mb-4">
                            <label class="text-xl font-bold">Anomaly Type: Flash Crash Sensitivity</label>
                            <span class="text-[#FF3131] font-mono text-xl">CRITICAL</span>
                        </div>
                        <input type="range" min="1" max="10" step="1" value="9">
                    </div>
                </div>
            </div>

            <!-- Notifications -->
            <div class="high-contrast-card p-10">
                <h2 class="text-2xl font-bold mb-8 flex items-center gap-4">
                    <i class="fas fa-tower-broadcast text-[#00FF41]"></i> Notification Channels
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-6 bg-[#21262D] rounded-xl border border-[#30363D] flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <i class="fab fa-telegram text-3xl text-[#58A6FF]"></i>
                            <span class="font-bold">Telegram Bot</span>
                        </div>
                        <div class="w-12 h-6 bg-emerald-600 rounded-full relative"><div class="w-4 h-4 bg-white rounded-full absolute right-1 top-1"></div></div>
                    </div>
                    <div class="p-6 bg-[#21262D] rounded-xl border border-[#30363D] flex justify-between items-center opacity-50">
                        <div class="flex items-center gap-4">
                            <i class="fas fa-envelope text-3xl"></i>
                            <span class="font-bold">Email Alert</span>
                        </div>
                        <div class="w-12 h-6 bg-[#30363D] rounded-full relative"><div class="w-4 h-4 bg-white rounded-full absolute left-1 top-1"></div></div>
                    </div>
                </div>
            </div>

            <button class="w-full py-6 bg-[#238636] hover:bg-[#2ea043] rounded-xl text-2xl font-black uppercase tracking-widest shadow-2xl">
                Deploy Configuration →
            </button>
        </div>
    </main>
</body>
</html>
